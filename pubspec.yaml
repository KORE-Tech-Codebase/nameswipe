name: namora
description: "Namora - Baby Name Finder"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4

  # UI
  flutter_svg: ^2.0.16
  flutter_card_swiper: ^7.0.1
  cupertino_icons: ^1.0.8
  flutter_markdown_plus: ^1.0.2

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Sharing
  share_plus: ^10.1.3

  # Rating
  in_app_review: ^2.0.10

  # Ads
  google_mobile_ads: ^5.3.0
  gma_mediation_unity: ^1.2.0
  gma_mediation_meta: ^1.1.0

  # Utils
  intl: ^0.19.0

  # Annotations (needed at runtime)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.2

  # App Assets Generation
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3

# Flutter Native Splash config
flutter_native_splash:
  color: "#ff5953"
  image: assets/icon/app_icon_padded.png
  android: true
  ios: false
  android_gravity: center
  fullscreen: true

  android_12:
    color: "#ff5953"
    icon_background_color: "#ff5953"


# Flutter Launcher Icons config
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ff5953"
  adaptive_icon_foreground: "assets/icon/app_icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/data/
    - assets/icon/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

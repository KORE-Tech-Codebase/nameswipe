<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE0E0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <circle cx="256" cy="230" r="180" fill="white" opacity="0.08"/>
  <!-- Large "N" letterform -->
  <text x="256" y="310" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="900" fill="white" text-anchor="middle" opacity="0.95">N</text>
  <!-- Small heart above the N -->
  <g transform="translate(320, 100) scale(2.5)">
    <path d="M8 4C8 1.8 9.8 0 12 0s4 1.8 4 4c0 0 0 0 0 0C16 1.8 17.8 0 20 0s4 1.8 4 4c0 5.5-8 9.5-8 9.5S8 9.5 8 4z" fill="white" opacity="0.9"/>
  </g>
  <!-- Subtle sparkle dots -->
  <circle cx="120" cy="120" r="6" fill="white" opacity="0.3"/>
  <circle cx="400" cy="400" r="4" fill="white" opacity="0.25"/>
  <circle cx="130" cy="390" r="5" fill="white" opacity="0.2"/>
</svg>
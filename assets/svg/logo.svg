<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8F60"/>
    </linearGradient>
  </defs>
  <!-- "Name" text -->
  <text x="10" y="42" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#FF6B35" letter-spacing="-1">Name</text>
  <!-- "Swipe" text -->
  <text x="98" y="42" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="300" fill="#FF6B35" letter-spacing="-1">Swipe</text>
  <!-- Heart icon integrated above the "i" in Swipe -->
  <g transform="translate(120, 8)">
    <path d="M6 3C6 1.3 7.3 0 9 0s3 1.3 3 3c0 0 0 0 0 0C12 1.3 13.3 0 15 0s3 1.3 3 3c0 4-6 7-6 7S6 7 6 3z" fill="#FF4081" opacity="0.9"/>
  </g>
  <!-- Subtle underline swipe gesture -->
  <path d="M10 52 Q60 48 100 50 Q140 52 190 48" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Small dot accent -->
  <circle cx="192" cy="47" r="2" fill="#FF4081"/>
</svg>
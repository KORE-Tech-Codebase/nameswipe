<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
  </defs>
  <!-- "N" accent mark -->
  <circle cx="18" cy="10" r="3" fill="url(#heartGrad)" opacity="0.8"/>
  <!-- "Namora" text -->
  <text x="8" y="42" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="url(#logoGrad)" letter-spacing="-1">Namora</text>
  <!-- Heart integrated into the "a" tail -->
  <g transform="translate(156, 18)">
    <path d="M4 2C4 0.9 4.9 0 6 0s2 0.9 2 2c0 0 0 0 0 0C8 0.9 8.9 0 10 0s2 0.9 2 2c0 2.8-4 5-4 5S4 4.8 4 2z" fill="url(#heartGrad)" opacity="0.85"/>
  </g>
  <!-- Subtle curved underline -->
  <path d="M12 50 Q50 46 100 48 Q150 50 188 46" stroke="url(#logoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Small sparkle dot -->
  <circle cx="190" cy="45" r="2.5" fill="#FF4081" opacity="0.7"/>
</svg>
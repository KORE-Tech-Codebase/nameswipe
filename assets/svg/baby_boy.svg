<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Baby boy silhouette - simple, modern, minimal -->
  <g opacity="0.12" fill="white">
    <!-- Head -->
    <circle cx="60" cy="35" r="20"/>
    <!-- Body -->
    <ellipse cx="60" cy="72" rx="18" ry="22"/>
    <!-- Left arm -->
    <ellipse cx="38" cy="65" rx="6" ry="14" transform="rotate(-15, 38, 65)"/>
    <!-- Right arm -->
    <ellipse cx="82" cy="65" rx="6" ry="14" transform="rotate(15, 82, 65)"/>
    <!-- Left leg -->
    <ellipse cx="50" cy="98" rx="7" ry="12"/>
    <!-- Right leg -->
    <ellipse cx="70" cy="98" rx="7" ry="12"/>
    <!-- Little cap brim -->
    <rect x="40" y="18" width="40" height="6" rx="3"/>
    <!-- Cap top -->
    <ellipse cx="60" cy="20" rx="16" ry="8"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8F60"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F4"/>
      <stop offset="100%" stop-color="#FFE8D8"/>
    </linearGradient>
    <linearGradient id="filterGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA6"/>
      <stop offset="100%" stop-color="#4DD8C0"/>
    </linearGradient>
    <linearGradient id="filterGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#FF6CA0"/>
    </linearGradient>
    <filter id="searchShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF6B3530"/>
    </filter>
    <filter id="chipShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Background circles -->
  <circle cx="150" cy="140" r="130" fill="#FFF8F4" opacity="0.6"/>
  <circle cx="140" cy="130" r="95" fill="#FFF3ED" opacity="0.3"/>

  <!-- Magnifying glass -->
  <g transform="translate(140, 115)" filter="url(#searchShadow)">
    <!-- Glass lens (outer ring) -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#glassGrad)" stroke-width="8"/>
    <!-- Glass lens (inner fill) -->
    <circle cx="0" cy="0" r="48" fill="url(#lensFill)" opacity="0.5"/>
    <!-- Glass reflection -->
    <ellipse cx="-15" cy="-18" rx="18" ry="10" fill="white" opacity="0.4" transform="rotate(-30, -15, -18)"/>
    <!-- Handle -->
    <line x1="37" y1="37" x2="68" y2="68" stroke="url(#glassGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Handle highlight -->
    <line x1="39" y1="39" x2="65" y2="65" stroke="#FF8F60" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

    <!-- Text inside lens "Aa" -->
    <text x="-5" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FF6B35" font-weight="700" opacity="0.6">A</text>
    <text x="12" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FF6B35" font-weight="400" opacity="0.45">a</text>

    <!-- Small search sparkles inside -->
    <g transform="translate(-28, 10)">
      <circle cx="0" cy="0" r="2.5" fill="#00BFA6" opacity="0.4"/>
    </g>
    <g transform="translate(25, -25)">
      <circle cx="0" cy="0" r="2" fill="#FF4081" opacity="0.4"/>
    </g>
    <g transform="translate(-18, 25)">
      <circle cx="0" cy="0" r="1.8" fill="#FF6B35" opacity="0.35"/>
    </g>
  </g>

  <!-- Filter chips / tags below the magnifying glass -->
  <!-- Chip 1: Gender filter -->
  <g transform="translate(68, 205)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="72" height="28" rx="14" fill="white" stroke="#00BFA6" stroke-width="1.5"/>
    <!-- Gender icon -->
    <circle cx="18" cy="14" r="5" fill="#00BFA6" opacity="0.2"/>
    <circle cx="18" cy="12" r="2.5" fill="none" stroke="#00BFA6" stroke-width="1.2"/>
    <line x1="18" y1="14.5" x2="18" y2="18" stroke="#00BFA6" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="30" y="9" width="32" height="4" rx="2" fill="#00BFA6" opacity="0.6"/>
    <rect x="30" y="16" width="22" height="3" rx="1.5" fill="#00BFA6" opacity="0.3"/>
  </g>

  <!-- Chip 2: Origin filter -->
  <g transform="translate(150, 205)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="white" stroke="#FF4081" stroke-width="1.5"/>
    <!-- Globe icon -->
    <circle cx="18" cy="14" r="6" fill="#FF4081" opacity="0.15"/>
    <circle cx="18" cy="14" r="5" fill="none" stroke="#FF4081" stroke-width="1"/>
    <ellipse cx="18" cy="14" rx="3" ry="5" fill="none" stroke="#FF4081" stroke-width="0.7"/>
    <line x1="12.5" y1="14" x2="23.5" y2="14" stroke="#FF4081" stroke-width="0.7"/>
    <rect x="30" y="9" width="38" height="4" rx="2" fill="#FF4081" opacity="0.6"/>
    <rect x="30" y="16" width="26" height="3" rx="1.5" fill="#FF4081" opacity="0.3"/>
  </g>

  <!-- Chip 3: Letter filter -->
  <g transform="translate(85, 242)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="60" height="28" rx="14" fill="white" stroke="#FF6B35" stroke-width="1.5"/>
    <!-- Letter A icon -->
    <circle cx="18" cy="14" r="6" fill="#FF6B35" opacity="0.15"/>
    <text x="18" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF6B35" font-weight="700">A</text>
    <rect x="30" y="9" width="20" height="4" rx="2" fill="#FF6B35" opacity="0.6"/>
    <rect x="30" y="16" width="14" height="3" rx="1.5" fill="#FF6B35" opacity="0.3"/>
  </g>

  <!-- Chip 4: Length filter -->
  <g transform="translate(155, 242)" filter="url(#chipShadow)">
    <rect x="0" y="0" width="66" height="28" rx="14" fill="white" stroke="#00BFA6" stroke-width="1.5"/>
    <!-- Ruler icon -->
    <rect x="12" y="10" width="14" height="8" rx="1.5" fill="none" stroke="#00BFA6" stroke-width="1.2"/>
    <line x1="15" y1="10" x2="15" y2="13" stroke="#00BFA6" stroke-width="0.8"/>
    <line x1="19" y1="10" x2="19" y2="14.5" stroke="#00BFA6" stroke-width="0.8"/>
    <line x1="23" y1="10" x2="23" y2="13" stroke="#00BFA6" stroke-width="0.8"/>
    <rect x="32" y="9" width="24" height="4" rx="2" fill="#00BFA6" opacity="0.6"/>
    <rect x="32" y="16" width="16" height="3" rx="1.5" fill="#00BFA6" opacity="0.3"/>
  </g>

  <!-- Decorative floating elements -->
  <!-- Small magnifying glass -->
  <g transform="translate(60, 90) scale(0.35)" opacity="0.2">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FF6B35" stroke-width="3"/>
    <line x1="9" y1="9" x2="16" y2="16" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Star -->
  <g transform="translate(245, 85)" opacity="0.2">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#FF4081" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#FF4081" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#FF4081" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#FF4081" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="50" cy="155" r="4" fill="#FF6B35" opacity="0.12"/>
  <circle cx="260" cy="145" r="5" fill="#00BFA6" opacity="0.1"/>
  <circle cx="45" cy="240" r="3" fill="#FF4081" opacity="0.12"/>
  <circle cx="260" cy="250" r="4" fill="#FF6B35" opacity="0.1"/>
  <circle cx="150" cy="285" r="3" fill="#00BFA6" opacity="0.1"/>
</svg>
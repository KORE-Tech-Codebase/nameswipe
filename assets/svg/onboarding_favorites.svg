<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="listBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F4"/>
    </linearGradient>
    <filter id="favShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000018"/>
    </filter>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#FF408140"/>
    </filter>
  </defs>

  <!-- Background circles -->
  <circle cx="150" cy="150" r="130" fill="#FFF8F4" opacity="0.6"/>
  <circle cx="150" cy="130" r="95" fill="#FFF3ED" opacity="0.3"/>

  <!-- Large heart at top -->
  <g transform="translate(150, 75)" filter="url(#heartGlow)">
    <g transform="scale(2.2) translate(-12, -12)">
      <path d="M12 4.5C12 2 14 0 16.5 0S21 2 21 4.5c0 0 0 0 0 0C21 2 23 0 25.5 0S30 2 30 4.5C30 12 21 17 21 17S12 12 12 4.5z" fill="url(#heartGrad)" transform="translate(-21, -8) scale(1)"/>
    </g>
    <!-- Sparkle on heart -->
    <g transform="translate(14, -22)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    </g>
    <!-- Plus badge -->
    <circle cx="22" cy="-12" r="10" fill="#00BFA6"/>
    <line x1="22" y1="-16" x2="22" y2="-8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="-12" x2="26" y2="-12" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Favorites list card -->
  <g transform="translate(150, 195)" filter="url(#favShadow)">
    <rect x="-75" y="-45" width="150" height="110" rx="14" fill="url(#listBg)" stroke="#F0E0D6" stroke-width="1"/>

    <!-- List item 1 -->
    <g transform="translate(0, -30)">
      <circle cx="-50" cy="0" r="8" fill="#FF6B35" opacity="0.15"/>
      <g transform="translate(-50, 0) scale(0.35)">
        <path d="M0 -6C0 -9.5 2.5 -12 5.5 -12S11 -9.5 11 -6c0 0 0 0 0 0C11 -9.5 13.5 -12 16.5 -12S22 -9.5 22 -6C22 2 11 7 11 7S0 2 0 -6z" fill="#FF4081" transform="translate(-11, 6)"/>
      </g>
      <rect x="-34" y="-4" width="55" height="5" rx="2.5" fill="#444" opacity="0.6"/>
      <rect x="-34" y="5" width="35" height="3.5" rx="1.75" fill="#999" opacity="0.35"/>
      <circle cx="50" cy="0" r="6" fill="#00BFA6" opacity="0.2"/>
      <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#00BFA6" font-weight="700">1</text>
    </g>

    <!-- List item 2 -->
    <g transform="translate(0, -2)">
      <line x1="-60" y1="-14" x2="60" y2="-14" stroke="#F0E0D6" stroke-width="0.5"/>
      <circle cx="-50" cy="0" r="8" fill="#FF4081" opacity="0.12"/>
      <g transform="translate(-50, 0) scale(0.35)">
        <path d="M0 -6C0 -9.5 2.5 -12 5.5 -12S11 -9.5 11 -6c0 0 0 0 0 0C11 -9.5 13.5 -12 16.5 -12S22 -9.5 22 -6C22 2 11 7 11 7S0 2 0 -6z" fill="#FF6B35" transform="translate(-11, 6)"/>
      </g>
      <rect x="-34" y="-4" width="48" height="5" rx="2.5" fill="#444" opacity="0.6"/>
      <rect x="-34" y="5" width="30" height="3.5" rx="1.75" fill="#999" opacity="0.35"/>
      <circle cx="50" cy="0" r="6" fill="#00BFA6" opacity="0.2"/>
      <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#00BFA6" font-weight="700">2</text>
    </g>

    <!-- List item 3 -->
    <g transform="translate(0, 26)">
      <line x1="-60" y1="-14" x2="60" y2="-14" stroke="#F0E0D6" stroke-width="0.5"/>
      <circle cx="-50" cy="0" r="8" fill="#00BFA6" opacity="0.12"/>
      <g transform="translate(-50, 0) scale(0.35)">
        <path d="M0 -6C0 -9.5 2.5 -12 5.5 -12S11 -9.5 11 -6c0 0 0 0 0 0C11 -9.5 13.5 -12 16.5 -12S22 -9.5 22 -6C22 2 11 7 11 7S0 2 0 -6z" fill="#00BFA6" transform="translate(-11, 6)"/>
      </g>
      <rect x="-34" y="-4" width="52" height="5" rx="2.5" fill="#444" opacity="0.6"/>
      <rect x="-34" y="5" width="38" height="3.5" rx="1.75" fill="#999" opacity="0.35"/>
      <circle cx="50" cy="0" r="6" fill="#00BFA6" opacity="0.2"/>
      <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#00BFA6" font-weight="700">3</text>
    </g>

    <!-- List item 4 (fading) -->
    <g transform="translate(0, 52)" opacity="0.45">
      <line x1="-60" y1="-14" x2="60" y2="-14" stroke="#F0E0D6" stroke-width="0.5"/>
      <circle cx="-50" cy="0" r="8" fill="#FF6B35" opacity="0.12"/>
      <rect x="-34" y="-4" width="40" height="5" rx="2.5" fill="#444" opacity="0.4"/>
      <rect x="-34" y="5" width="28" height="3.5" rx="1.75" fill="#999" opacity="0.25"/>
    </g>
  </g>

  <!-- Floating small hearts decoration -->
  <g transform="translate(65, 110) scale(0.5)" opacity="0.3">
    <path d="M0 -4C0 -6.5 1.8 -8 4 -8S8 -6.5 8 -4C8 1 4 4 4 4S0 1 0 -4z" fill="#FF4081"/>
  </g>
  <g transform="translate(235, 95) scale(0.6)" opacity="0.25">
    <path d="M0 -4C0 -6.5 1.8 -8 4 -8S8 -6.5 8 -4C8 1 4 4 4 4S0 1 0 -4z" fill="#FF6B35"/>
  </g>
  <g transform="translate(80, 250) scale(0.4)" opacity="0.2">
    <path d="M0 -4C0 -6.5 1.8 -8 4 -8S8 -6.5 8 -4C8 1 4 4 4 4S0 1 0 -4z" fill="#00BFA6"/>
  </g>
  <g transform="translate(225, 255) scale(0.5)" opacity="0.2">
    <path d="M0 -4C0 -6.5 1.8 -8 4 -8S8 -6.5 8 -4C8 1 4 4 4 4S0 1 0 -4z" fill="#FF4081"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="55" cy="170" r="3" fill="#FF6B35" opacity="0.15"/>
  <circle cx="248" cy="165" r="4" fill="#00BFA6" opacity="0.12"/>
  <circle cx="150" cy="272" r="3" fill="#FF4081" opacity="0.12"/>
</svg>
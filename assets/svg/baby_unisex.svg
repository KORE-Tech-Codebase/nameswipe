<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Generic baby silhouette - simple, modern, minimal -->
  <g opacity="0.12" fill="white">
    <!-- Head -->
    <circle cx="60" cy="35" r="20"/>
    <!-- Soft hair tuft -->
    <ellipse cx="60" cy="18" rx="12" ry="6"/>
    <ellipse cx="52" cy="20" rx="6" ry="8" transform="rotate(15, 52, 20)"/>
    <ellipse cx="68" cy="20" rx="6" ry="8" transform="rotate(-15, 68, 20)"/>
    <!-- Body (onesie shape) -->
    <path d="M44 52 Q44 48 60 48 Q76 48 76 52 L78 90 Q78 100 60 100 Q42 100 42 90 Z"/>
    <!-- Left arm -->
    <ellipse cx="40" cy="60" rx="5.5" ry="13" transform="rotate(-10, 40, 60)"/>
    <!-- Right arm -->
    <ellipse cx="80" cy="60" rx="5.5" ry="13" transform="rotate(10, 80, 60)"/>
    <!-- Left foot -->
    <ellipse cx="52" cy="104" rx="6" ry="4"/>
    <!-- Right foot -->
    <ellipse cx="68" cy="104" rx="6" ry="4"/>
    <!-- Star on chest -->
    <polygon points="60,62 62,66 66,66 63,69 64,73 60,70 56,73 57,69 54,66 58,66" opacity="0.6"/>
  </g>
</svg>